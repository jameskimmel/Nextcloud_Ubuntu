server {
    server_name cloud.x_yourdomain.com;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cloud.x_yourdomain.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cloud.x_yourdomain.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    http2 on;

    # disable proxy buffers
    proxy_buffering off;
    proxy_request_buffering off;

    client_max_body_size 0;
    client_body_buffer_size 512k;

    # This value should be higher than the PHP timeout (1h), so that Nextcloud always times out and not NGINX
    proxy_read_timeout 3610s;

    # add headers
    add_header Referrer-Policy           "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # logging
    access_log              /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log               /var/log/nginx/error.log warn;
    
    # reverse proxy
    location / {
        # change this IP according to your setup. Also change the port. 
        # If you are using Nextcloud AIO you probably are listening on port 11000, but if you are a LAMP installation you probably are listening on port 80.
        proxy_pass http://192.168.1.2:80$request_uri;

        # this line is probably also not needed, since you probably don't have caching enabled anywhere else. But it also does not hurt :)
        #proxy_cache_bypass                 $http_upgrade;

        # Proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # Websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        #this line is currently not really needed, since 1.1 is the default anyway. Version 2 is not included by default and has known issues. 
        proxy_http_version                 1.1;
    }

}

server {
    if ($host = cloud.x_yourdomain.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    listen      [::]:80;
    server_name cloud.x_yourdomain.com;
    return 404; # managed by Certbot


}

map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
